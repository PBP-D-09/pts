{% load static lucide %}

<footer class="bg-secondary-20 px-5 py-10 sm:px-8 lg:px-14">
  <div class="mx-auto max-w-280">
    <div class="flex flex-col gap-10 lg:flex-row lg:items-start lg:justify-between">
      <div class="flex justify-between gap-10 lg:gap-20">
        <a class="text-h5 text-primary-80"
           href="{% url "landing:landing" %}">Sustaina<span class="text-tertiary-80">Bowl</span></a>
        <nav class="text-h5 grid gap-1 text-neutral-100"
             aria-label="Navigasi footer">
          <a href="{% url "landing:landing" %}" class="cursor-pointer">Home</a>
          <a href="#manfaat" class="cursor-pointer">Catalog</a>
          <a href="#tentang" class="cursor-pointer">Tenants</a>
        </nav>
      </div>
      <div class="text-center lg:pr-12">
        <p class="text-h5 text-neutral-100">Connect with Us!</p>
        <div class="mt-3 flex justify-center gap-4 text-primary-90">
          <a class="ui-icon-button ui-icon-button--ghost"
             href="mailto:hello@sustainabowl.com">{% lucide "mail" size=24 stroke_width=2 %}</a>
          <a class="ui-icon-button ui-icon-button--ghost"
             href="https://instagram.com"
             aria-label="Instagram SustainaBowl">
            <img src="https://cdn.simpleicons.org/instagram/134954"
                 alt="Instagram SustainaBowl"
                 class="w-6 h-6" />
          </a>
        </div>
      </div>
    </div>
    <div class="text-h5 mt-7 flex items-center border-t border-primary-40 pt-3 text-neutral-100">
      {% lucide "copyright" size=24 stroke_width=2 %}
      <span class="ml-2">2026 <span class="text-primary-80">Sustaina</span><span class="text-tertiary-80">Bowl</span></span>
    </div>
  </div>
</footer>
