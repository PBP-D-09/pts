<div id="delete-modal"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-gray-900/40 p-4 backdrop-blur-sm"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-modal-title">

    <div class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-2xl sm:p-8">

        <div class="flex items-start gap-4">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-red-50 text-red-600">
                <icon name="alert-triangle" size="2xl" />
            </div>

            <div class="min-w-0 flex-1">
                <h2 id="delete-modal-title"
                    class="text-xl font-bold text-gray-900">
                    Delete item?
                </h2>

                <p id="delete-modal-message"
                   class="mt-2 break-words text-sm leading-6 text-gray-500">
                    Are you sure you want to delete this object? This action cannot be undone.
                </p>
            </div>
        </div>

        <form id="delete-modal-form" method="post" class="mt-8">
            {% csrf_token %}

            <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
                <button type="button"
                        id="cancel-delete"
                        class="inline-flex items-center justify-center rounded-xl border border-gray-200 px-5 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-300">
                    Cancel
                </button>

                <button type="submit"
                        class="inline-flex items-center justify-center gap-2 rounded-xl bg-red-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                    <icon name="trash-2" size="sm" />
                    Delete
                </button>
            </div>
        </form>
    </div>
</div>
