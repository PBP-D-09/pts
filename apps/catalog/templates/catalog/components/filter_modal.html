<!-- Cuisine filter modal backdrop -->
<div
    id="filter-modal"
    popover
    class="fixed left-1/2 top-1/2
           -translate-x-1/2 -translate-y-1/2 m-0
           w-[calc(100%-2rem)] max-w-2xl
           max-h-[85vh] overflow-y-auto
           rounded-3xl bg-white p-6 shadow-2xl
           sm:p-8
           [&::backdrop]:bg-black/40
           [&::backdrop]:backdrop-blur-sm">
    <!-- Modal content -->
    <div
        class="w-full max-w-2xl max-h-[85vh] overflow-y-auto
               rounded-3xl bg-white p-6 shadow-2xl
               sm:p-8 scale-95
               transition-transform duration-300 ease-in-out">
        <!-- Header -->
        <div class="mb-6 flex items-start justify-between gap-4">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-gray-900">
                    Choose your cuisine
                </h2>

                <p class="mt-2 text-sm text-gray-500">
                    Select the cuisines you're in the mood for.
                </p>
            </div>

            <button type="button"
                	id="close-cuisine-modal"
                	aria-label="Close cuisine modal"
                	class="flex h-10 w-10 shrink-0 items-center
                    	justify-center rounded-full text-gray-500
                    	transition hover:bg-gray-100 hover:text-gray-900">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-5 w-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M6 18 18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Cuisine grid -->
        <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 sm:gap-4">
            {% for cuisine in cuisines %}
                <button type="button"
                    	data-cuisine-id="{{ cuisine.pk }}"
                    	aria-pressed="false"
                    	class="flex min-h-24 items-center justify-center
                           	   rounded-2xl border-2 border-gray-200
                           	   bg-white p-4 text-center text-sm
                           	   font-semibold text-gray-700
                           	   transition-all duration-200
                           	   hover:border-green-500 hover:bg-green-50
                           	   focus:outline-none focus:ring-2
                           	   focus:ring-green-500 focus:ring-offset-2">
                    <span>{{ cuisine.name }}</span>
                </button>
            {% empty %}
                <p class="col-span-full py-8 text-center text-sm text-gray-500">
                    No cuisines available.
                </p>
            {% endfor %}
        </div>

        <!-- Footer -->
        <div class="mt-8 flex flex-col-reverse gap-3 border-t
             	    border-gray-100 pt-5 sm:flex-row sm:justify-between">
            <button type="button"
                	id="clear-cuisines"
                	class="rounded-xl px-5 py-3 text-sm font-semibold
                       	   text-gray-600 transition hover:bg-gray-100">
                Clear selection
            </button>

            <div class="flex gap-3">
                <button
					type="button"
					id="cancel-cuisine-modal"
					popovertarget="filter-modal"
					popovertargetaction="hide"
					class="flex-1 rounded-xl border border-gray-200
						px-5 py-3 text-sm font-semibold
						text-gray-700 transition hover:bg-gray-50
						sm:flex-none">
					Cancel
				</button>

                <button
					type="button"
					id="apply-cuisines"
					popovertarget="filter-modal"
					popovertargetaction="hide"
					class="flex-1 rounded-xl bg-green-600 px-6 py-3
						text-sm font-semibold text-white shadow-sm
						transition hover:bg-green-700
						focus:outline-none focus:ring-2
						focus:ring-green-500 focus:ring-offset-2
						sm:flex-none">
					Apply filters
				</button>
            </div>
        </div>
    </div>
</div>
