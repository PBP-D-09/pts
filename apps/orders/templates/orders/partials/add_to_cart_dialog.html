{% load static lucide %}

<dialog class="ui-dialog m-auto w-[min(26rem,calc(100%-2rem))] p-0 backdrop:bg-primary-100/50"
        aria-labelledby="add-to-cart-title"
        data-add-to-cart-dialog>
  <form method="dialog" class="grid gap-5 p-6" data-add-to-cart-confirm>
    <h2 id="add-to-cart-title" class="text-h6 text-primary-100">Add to cart</h2>
    <div class="flex gap-4">
      <img alt=""
           class="size-20 shrink-0 rounded-lg object-cover"
           data-item-photo
           hidden>
      <span class="flex size-20 shrink-0 items-center justify-center rounded-lg bg-surface-subtle text-neutral-70"
            data-item-photo-placeholder>{% lucide "utensils" size=24 stroke_width=1.75 %}</span>
      <div class="min-w-0">
        <p class="text-s7 break-words text-primary-100" data-item-name></p>
        <p class="text-b8 text-neutral-70" data-item-tenant></p>
        <p class="text-s8 mt-1 tabular-nums text-primary-100" data-item-price></p>
      </div>
    </div>
    <div class="flex items-center justify-between gap-4 border-t border-border-subtle pt-4">
      <label for="add-to-cart-quantity" class="text-s8 text-primary-100">Quantity</label>
      <div class="flex h-9 items-center rounded-full bg-surface-subtle p-0.5">
        <button type="button"
                class="flex size-7 items-center justify-center rounded-full bg-neutral-10 text-primary-100 ring-1 ring-border-subtle transition hover:bg-surface-subtle disabled:cursor-not-allowed disabled:opacity-40"
                aria-label="Decrease quantity"
                data-quantity-step="-1">
          {% lucide "minus" size=14 stroke_width=2.5 %}
        </button>
        <input id="add-to-cart-quantity"
               type="number"
               min="1"
               max="20"
               value="1"
               inputmode="numeric"
               class="text-s8 w-10 appearance-none bg-transparent text-center tabular-nums text-primary-100 [-moz-appearance:textfield] [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
               data-quantity-input>
        <button type="button"
                class="flex size-7 items-center justify-center rounded-full bg-neutral-10 text-primary-100 ring-1 ring-border-subtle transition hover:bg-surface-subtle disabled:cursor-not-allowed disabled:opacity-40"
                aria-label="Increase quantity"
                data-quantity-step="1">
          {% lucide "plus" size=14 stroke_width=2.5 %}
        </button>
      </div>
    </div>
    <div class="flex items-center justify-between">
      <span class="text-b7 text-neutral-70">Subtotal</span>
      <span class="text-s6 tabular-nums text-primary-100"
            aria-live="polite"
            data-quantity-subtotal></span>
    </div>
    <div class="flex justify-end gap-3">
      <button type="button"
              class="text-s8 rounded-md px-3 text-primary-100 hover:bg-surface-subtle"
              data-dialog-close>
        Cancel
      </button>
      <button type="submit" class="ui-button ui-button--tertiary">Add to cart</button>
    </div>
  </form>
</dialog>
<script src="{% static 'orders/add_to_cart.js' %}" defer></script>
