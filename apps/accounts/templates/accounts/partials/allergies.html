{% load lucide %}

<form hx-post="{% url 'accounts:manage_allergy' %}"
      hx-target="#allergies"
      hx-swap="innerHTML"
      class="flex gap-2">
  <label class="sr-only" for="allergy-name">Nama alergi</label><input id="allergy-name"
       name="name"
       maxlength="50"
       placeholder="Contoh: Kacang"
       class="ui-input min-w-0 flex-1"><button type="submit"
        class="ui-button ui-button--primary min-h-8.5 px-3 py-1 text-s8">
    Tambah
  </button>
</form>
<div class="mt-3 flex flex-wrap gap-2">
  {% for allergy in profile.allergies.all %}
    <span class="ui-tag ui-tag--warning">{{ allergy.name }}
      <button class="-mr-1 grid size-4 place-items-center rounded-full hover:bg-warning-20"
              type="button"
              hx-post="{% url 'accounts:manage_allergy' %}"
              hx-vals='{"delete": "{{ allergy.pk }}"}'
              hx-target="#allergies"
              hx-swap="innerHTML">
        {% lucide "x" size=14 stroke_width=2 %}
      </button>
    </span>
  {% endfor %}
</div>
